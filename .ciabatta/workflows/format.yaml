# The gates. CI runs exactly this workflow, on all three platforms, so a green
# `ciabatta test` locally means a green CI — there is no second list of checks
# in .github/workflows/ci.yml to drift away from this one.

description: Format, lint and test — everything CI gates on
owner: Henry Forsyth
requires:
  - cargo
steps:
  - name: format_rust
    run: cargo fmt --check
    description: Verify the tree is rustfmt-clean
    timeout: 2m

  - name: format_typescript
    # Release, because the suite is slow enough in debug to matter and because
    # this is the profile the shipped binary is built with.
    run: yarn format
    description: format the typescript code
    timeout: 1m
