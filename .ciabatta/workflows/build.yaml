# Converted from build.toml by `ciabatta config migrate`.
# Comments in the original weren't carried over — build.toml is still there
# if you want them back. Ciabatta now reads this file instead.
description: Build the daemon web app and the ciabatta binary
owner: Henry Forsyth

# Cross-package dependencies live here, on the workflow. A step's own `needs`
# names steps *in this file*; `tool_frontend:build` is somebody else's workflow,
# so it belongs at this level — the compiler pulls that whole unit in and orders
# it before everything here.
needs:
- tool_frontend:build
requires:
- cargo
steps:
- name: binary
  run: cargo build
  description: Compile the ciabatta CLI
  timeout: 20m
