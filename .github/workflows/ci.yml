name: CI

# One workflow for everything. Ordinary pushes and PRs build every artifact and
# run the gates on three platforms; a `v*` tag additionally cuts the release,
# publishes the crate, and deploys the website to GitHub Pages.
#
# Ciabatta drives its own build. `ciabatta build` and `ciabatta test` are the
# same two commands a contributor runs locally, and the graph they execute lives
# in `.ciabatta/workflows/` — so the ordering (web app and extension before the
# binary that embeds them) is described once, in the repository's own format,
# rather than a second time in YAML here. That does mean bootstrapping: the
# binary has to exist before it can orchestrate anything, so each job compiles
# one first. The bootstrap is only a task runner and its own embedded assets
# don't matter; `ciabatta build` rebuilds it properly with the real ones.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded branch build is worth cancelling; a half-finished release is not.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test should fail the leg, not sit on a runner until GitHub's 6h cap.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          cache: yarn
          cache-dependency-path: yarn.lock

      - run: yarn install --immutable

      # Stage 0. Nothing orchestrates this one, because there is nothing to
      # orchestrate it with yet. build.rs fills in a placeholder web app and an
      # empty extension directory so it compiles on a checkout where no JS has
      # been built; both are replaced by the step below.
      - name: Bootstrap a ciabatta to build with
        run: cargo build --release

      # Copied out of `target/release` rather than run from it, and on PATH
      # rather than called by path, so the steps below read the same on Windows,
      # where the file is `ciabatta.exe`, as everywhere else. The copy is what
      # makes Windows work at all: `ciabatta build` recompiles the binary into
      # `target/release`, and Windows locks a running executable's image file,
      # so cargo's attempt to replace the bootstrap while it is the process
      # orchestrating the build fails with "Access is denied. (os error 5)".
      - name: Put the bootstrap on PATH
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/.bootstrap"
          if [ -f target/release/ciabatta.exe ]; then
            cp target/release/ciabatta.exe "${{ github.workspace }}/.bootstrap/"
          else
            cp target/release/ciabatta "${{ github.workspace }}/.bootstrap/"
          fi
          echo "${{ github.workspace }}/.bootstrap" >> "$GITHUB_PATH"

      # Stage 1. The real build: tool_frontend, the VS Code extension, the
      # website, and then the binary — which embeds the first two, so it is
      # compiled again here with them in place.
      - name: Build everything
        run: ciabatta build

      - name: Verify the binary carries the real assets
        shell: bash
        run: |
          # build.rs substitutes a placeholder page when the bundle is missing,
          # and leaves editors/dist empty when the extension wasn't packaged.
          # Shipping either would produce a release whose UI says "run yarn
          # build" and whose Editors page offers nothing, so fail loudly here.
          if grep -q 'ciabatta-placeholder-bundle' tool_frontend/dist/index.html; then
            echo "::error::tool_frontend/dist holds the build.rs placeholder, not the built app."
            exit 1
          fi
          test -d tool_frontend/dist/assets
          test -s editors/dist/ciabatta-vscode.vsix

      # Format, clippy and the test suite. The step list is in
      # `.ciabatta/workflows/test.yaml`, which is what `ciabatta test` runs
      # locally too — one definition, so the two can't disagree.
      - name: Gates
        run: ciabatta test

      # The Zed extension is the one thing here nothing else would notice
      # breaking: it compiles to wasm for Zed's own host rather than being
      # embedded in the binary, so it is outside the `build` graph and no other
      # step touches it. One leg is enough — the wasm is the same wherever it is
      # built — and `rustup target add` is a no-op when the target is present.
      - name: Build the Zed extension
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-wasip1
          ciabatta package --only zed-extension

      # Built on every push, not just releases: a PR that changes the extension
      # should hand a reviewer something installable. The release job collects
      # this same artifact when the ref is a tag.
      - name: Upload the VS Code extension
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ciabatta-vscode.vsix
          path: editors/dist/ciabatta-vscode.vsix
          if-no-files-found: error

      # The public website is a member of the same graph, so `ciabatta build`
      # above already built it. Only *publishing* waits for a tag.
      - name: Upload pages artifact
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  # ---------------------------------------------------------------------------
  # Everything below here runs only for a `v*` tag.
  # ---------------------------------------------------------------------------

  # Cargo.toml is the source of truth for the version. Bump it in the release
  # commit before tagging; this job guards against tagging a stale version.
  verify:
    name: Verify version matches tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cargo.toml version == tag
        run: |
          CARGO_VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml version: $CARGO_VERSION"
          echo "Tag version:        $TAG_VERSION"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION. Bump Cargo.toml before tagging."
            exit 1
          fi

      - name: Check the extension version matches too
        run: |
          # The .vsix is a release asset alongside the binaries, and an
          # extension stamped with an older version than the CLI it launches is
          # exactly the confusion the download button is meant to remove.
          EXT_VERSION="$(node -p "require('./editors/vscode/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Extension version: $EXT_VERSION"
          if [ "$EXT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::editors/vscode/package.json is $EXT_VERSION, not $TAG_VERSION. Bump it before tagging."
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          # Linux builds target musl so the binaries are fully static with no
          # glibc dependency -- they run on any Linux distro, old or new.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            artifact: ciabatta
            archive: ciabatta-linux-x86_64.tar.gz
            use_cross: true

          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            artifact: ciabatta
            archive: ciabatta-linux-aarch64.tar.gz
            use_cross: true

          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: ciabatta
            archive: ciabatta-macos-x86_64.tar.gz

          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: ciabatta
            archive: ciabatta-macos-aarch64.tar.gz

          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: ciabatta.exe
            archive: ciabatta-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # The embedded assets are built on the host even for the musl legs —
      # `cross` mounts the checkout into its container, so what is produced here
      # is visible to the build inside.
      #
      # Called directly rather than through `ciabatta build`, which would mean
      # bootstrapping a native binary on every leg purely to sequence two
      # independent yarn commands. The one thing the graph adds — ordering the
      # assets before the binary — is expressed by the step order here, because
      # the binary below can't go through the graph anyway: it cross-compiles to
      # a specific --target, which the workflow's plain `cargo build --release`
      # can't express.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          cache: yarn
          cache-dependency-path: yarn.lock

      - run: yarn install --immutable

      - name: Build the web app
        run: yarn workspace ciabatta-tool-frontend build

      - name: Package the VS Code extension
        run: yarn workspace ciabatta-vscode build

      - name: Verify the real assets will be embedded
        shell: bash
        run: |
          if grep -q 'ciabatta-placeholder-bundle' tool_frontend/dist/index.html; then
            echo "::error::tool_frontend/dist holds the build.rs placeholder, not the built app."
            exit 1
          fi
          test -d tool_frontend/dist/assets
          test -s editors/dist/ciabatta-vscode.vsix

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} .
          cp install/install.sh .
          tar czf ${{ matrix.archive }} ${{ matrix.artifact }} install.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.artifact }} .
          Copy-Item install\install.ps1 .
          Compress-Archive -Path ${{ matrix.artifact }}, install.ps1 -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    # `test` as well as `build`, because the .vsix attached to the release is
    # the one that job uploaded — the release legs above build their own copy to
    # embed, but only one should be published.
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # `pattern`, not everything: the ubuntu test leg also uploads the website
      # for `deploy-pages`, under the name `github-pages` and packaged as
      # `artifact.tar`. Downloading the lot and globbing `artifacts/*` attached
      # that tarball to the release as a seventh asset, offering anyone browsing
      # the downloads a copy of the docs site next to the binaries. Every real
      # asset is named `ciabatta-*`; `deploy-pages` reads the website from the
      # Actions store, not from here, so filtering it out costs nothing.
      - name: Download the release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ciabatta-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/ciabatta-*

  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The crate carries tool_frontend/dist and editors/dist (see `include` in
      # Cargo.toml), so both have to be built here or the published crate ships
      # a placeholder page and no extension. Same reasoning as the release legs
      # for not going through `ciabatta build`.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          cache: yarn
          cache-dependency-path: yarn.lock

      - run: yarn install --immutable

      - name: Build the web app
        run: yarn workspace ciabatta-tool-frontend build

      - name: Package the VS Code extension
        run: yarn workspace ciabatta-vscode build

      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # The website goes live with the release it documents, not with every push to
  # a branch. It was built and uploaded by the ubuntu leg of `test`.
  deploy-pages:
    name: Deploy website to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
