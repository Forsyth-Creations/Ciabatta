<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ciabatta · daemon</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel2: #1d212c;
    --line: #262b38;
    --muted: #6b7280;
    --text: #e6e8ee;
    --accent: #34d399;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center;
    padding: 40px 16px;
  }
  main { width: 100%; max-width: 760px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  header .brand { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
  header .brand .crumb { color: var(--muted); font-weight: 400; }
  header .count { margin-left: auto; color: var(--muted); font-size: 13px; }
  p.note { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li.item {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px 16px;
  }
  .item .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .item .root { font-weight: 600; font-size: 14px; word-break: break-all; }
  .item .profile {
    font-size: 12px; color: #06281c; background: var(--accent);
    padding: 2px 8px; border-radius: 999px; font-weight: 600;
  }
  .item .error { color: var(--danger); font-size: 13px; margin-top: 6px; }
  .item .keys { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .item .key {
    font-size: 12px; font-family: ui-monospace, monospace; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 6px;
  }
  .item .events { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .item .events b { color: var(--text); font-weight: 600; }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">🍞 ciabatta <span class="crumb">/ daemon</span></div>
    <div class="count" id="count"></div>
  </header>
  <p class="note">Watched workspaces and their bound profile. Keys are shown, resolved values never are.</p>
  <ul class="list" id="list"></ul>
</main>
<script>
async function refresh() {
  const res = await fetch('/api/status');
  const workspaces = await res.json();
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  count.textContent = workspaces.length + ' workspace' + (workspaces.length === 1 ? '' : 's');

  if (workspaces.length === 0) {
    list.innerHTML = '<li class="empty">No workspaces registered yet — run `ciabatta daemon use &lt;profile&gt;` in a project.</li>';
    return;
  }

  list.innerHTML = workspaces.map(w => {
    const keys = w.keys.map(k => `<span class="key">${escapeHtml(k)}</span>`).join('');
    const error = w.last_error ? `<div class="error">${escapeHtml(w.last_error)}</div>` : '';
    const events = w.recent_events.slice(-5).reverse().map(e =>
      `<b>${escapeHtml(e.key)}</b> changed at ${escapeHtml(e.at)}`
    ).join(' · ');
    return `<li class="item">
      <div class="top">
        <span class="root">${escapeHtml(w.root)}</span>
        <span class="profile">${escapeHtml(w.profile)}</span>
      </div>
      ${error}
      <div class="keys">${keys}</div>
      ${events ? `<div class="events">${events}</div>` : ''}
    </li>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
