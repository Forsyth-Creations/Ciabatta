# Building the website into frontend/dist, which the release uploads to Pages.

description: Build the public website
owner: Henry Forsyth

requires:
  - yarn

# Paths are relative to the workspace root, not to this directory.
cache:
  enabled: true
  inputs:
    - "frontend/src/**/*"
    - "frontend/*.html"
    - "frontend/public/**/*"
    - "frontend/package.json"
    - "frontend/vite.config.js"
  outputs:
    - "frontend/dist/**/*"

steps:
  - name: build
    description: Bundle the site with Vite
    run: yarn build
    timeout: 10m
