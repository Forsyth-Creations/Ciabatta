[package]
name = "ciabatta"
version = "0.5.0"
edition = "2024"
description = "A command line tool for publishing artifacts to various registries"
license = "MIT"
readme = "README.md"
repository = "https://github.com/forsyth-creations/ciabatta"
homepage = "https://forsyth-creations.github.io/Ciabatta/"
keywords = ["artifact", "publishing", "cli", "registry", "ci"]
categories = ["command-line-utilities", "development-tools"]

# The daemon's web app is compiled into the binary from tool_frontend/dist, so
# a published crate has to carry it — it's gitignored build output, not source.
include = [
    "src/**/*",
    "build.rs",
    "tool_frontend/dist/**/*",
    # The config schemas are embedded in the binary and served to editors, so a
    # published crate has to carry them too, alongside the packaged extensions
    # the daemon offers for download. `editors/` is otherwise excluded: the
    # extensions' *sources* aren't part of the CLI, only their build output.
    "editors/schemas/*.json",
    "editors/dist/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[[bin]]
name = "ciabatta"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
futures = "0.3"
regex = "1"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
rustfmt = "0.10.0"
owo-colors = "4.3.0"
# The daemon's HTTP stack. hyper/http/tower are already in the tree via reqwest,
# so axum adds little beyond its own routing layer.
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# The built tool_frontend bundle is embedded in the binary at compile time.
include_dir = "0.7"
async-stream = "0.3"
rand = "0.8"
serde_yaml_ng = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# HTTPS for the remote cache server. All three are already in the tree through
# reqwest and ldap3; named here so the server can terminate TLS itself rather
# than needing a reverse proxy in front of it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
# `remote-cache init --tls` generates a self-signed certificate, so HTTPS works
# out of the box on a network with no CA to hand.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# Killing a timed-out or abandoned step means killing its whole process group:
# `sh -c "…"` forks rather than execs, so signalling the shell alone orphans
# whatever it started. Already in the tree via tokio; named here for `killpg`.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
