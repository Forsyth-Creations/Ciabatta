# Converted from ciabatta.toml by `ciabatta config migrate`.
# Comments in the original weren't carried over — ciabatta.toml is still there
# if you want them back. Ciabatta now reads this file instead.
system:
  containers: docker
workspace:
  name: ciabatta
  description: Monorepo orchestration and artifact publishing CLI
  owner: Henry Forsyth
  tags:
  - rust
  - cli
  - tooling
  requires:
  - cargo
toolchain:
  cargo:
    hint: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
    description: The Rust toolchain (cargo, rustc, clippy, rustfmt)
  yarn:
    hint: corepack enable && corepack prepare yarn@4 --activate
    description: Yarn 4, which drives the tool_frontend build
registries:
  nexus:
    url: http://localhost:8527
    tls_verify: false
    needs_auth: true
    repository: raw-hosted
    format: raw
ai:
  provider: openai
  endpoint: http://localhost:11434
  model: llama3.1:8b
  api_key_env: OPENAI_API_KEY
  tls_verify: true

cache:
  # What this workspace's builds read and write. Getting `inputs` right
  # is the part that matters: a build that reads a file not listed here
  # will be handed a stale result when that file changes.
  enabled: true
  inputs:
    - "src/**/*"   # source
    - "Cargo.toml"   # the Rust manifest
    - "Cargo.lock"   # pinned Rust dependencies
    - "package.json"   # the Node manifest
    - "Dockerfile"   # the image definition
  outputs:
    - "target/release/ciabatta"
  # Never treated as inputs, so a build can't invalidate itself.
  exclude:
    - ".git"
    - "node_modules"
    - "target"
    - "target/debug"
    - "target/release"
  # Variables the build's result depends on. A build that behaves
  # differently under a different PROFILE must list it here.
  env: []
  remote:
    project: ac795309-137d-47c4-a9ac-e9b84af48d8f
    url: http://127.0.0.1:8380/
    # `project` is filled in by the server the first time this
    # workspace connects. Commit it: it's what makes every checkout
    # and every CI runner resolve to the same project.
