# Bundling and packaging the extension. `yarn build` copies the shared schemas
# in itself, so there is no separate step for that — the typecheck is the only
# thing worth running as its own node, because a type error and a bundling
# error are different problems and the graph should say which one you have.
#
# Packaging is part of `build` rather than a workflow of its own because the
# `.vsix` is the only output anything downstream consumes: the daemon embeds it
# from `editors/dist/` and serves it for download, and the release attaches it.
# A "build" that stopped at dist/extension.js would leave the binary carrying
# yesterday's extension.

description: Bundle and package the VS Code extension
owner: Henry Forsyth

requires:
  - yarn

# Paths are relative to the workspace root, not to this directory. That is what
# lets the last output below be named plainly: `editors/dist/` is the one
# directory `build.rs` embeds, so both editors' packaged output lands in it, and
# reaching it from here used to take a `../` that the cache could not store.
cache:
  enabled: true
  inputs:
    - "editors/vscode/src/**/*"
    - "editors/vscode/scripts/**/*"
    - "editors/vscode/package.json"
    - "editors/vscode/tsconfig.json"
    - "editors/vscode/.vscodeignore"
    - "editors/vscode/icon.png"
    - "editors/vscode/README.md"
    - "editors/schemas/*.json"
  outputs:
    - "editors/vscode/dist/**/*"
    - "editors/vscode/schemas/*.json"
    - "editors/dist/ciabatta-vscode.vsix"

steps:
  - name: types
    description: Typecheck without emitting
    run: yarn run check
    timeout: 5m

  - name: bundle
    description: Copy the schemas in and bundle to dist/extension.js
    run: yarn run bundle
    needs:
      - types
    timeout: 5m

  - name: package
    description: Package the .vsix into editors/dist/, where the daemon embeds it
    run: yarn run package
    needs:
      - bundle
    timeout: 5m
