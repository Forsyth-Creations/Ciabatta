description: Build everything the ciabatta binary embeds, then the binary
owner: Henry Forsyth

# Cross-package dependencies live here, on the workflow. A step's own `needs`
# names steps *in this file*; these are somebody else's workflows, so they
# belong at this level — the compiler pulls each whole unit in and orders it
# before everything here.
#
# All of them produce something `build.rs` compiles into the binary, which is
# why they are dependencies rather than siblings: `tool_frontend` builds the
# web app the daemon serves, `remote-cache-web` the admin app the remote cache
# server serves, and `vscode-extension` packages the `.vsix` the daemon offers
# for download. Build the binary without them and it carries placeholder pages
# and no extension.
needs:
- tool_frontend:build
- remote-cache-web:build
- vscode-extension:build
requires:
- cargo
steps:
- name: binary
  run: cargo build --release
  description: Compile the ciabatta CLI, embedding the web app and the extension
  timeout: 30m
