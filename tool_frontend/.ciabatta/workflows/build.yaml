# The "build" workflow for frontend.
#
# Run it across the whole monorepo with `ciabatta build`, or just this
# package with `ciabatta build --only frontend`. See the graph first with
# `ciabatta build --graph`.

description: "Build the frontend"
owner: Henry Forsyth

# Workflows in other sub-workspaces that must finish first. "other" means their
# workflow of this same name; "other:generate" names a specific one.
needs: []

# Tools every step here needs on PATH. Missing ones are reported before anything
# runs, with the install command from the root's `toolchain:` section.
requires: []

# REQUIRED_ENV: [API_TOKEN]   # refuse to start unless these are set
# env_file: .env              # sourced before the run

# Paths are relative to the workspace root, not to this directory — the cache
# is one thing per project (one store, one `cache.remote`), so one directory has
# to be what its paths mean. `ciabatta why tool_frontend:build` lists what these
# actually matched.
cache:
  enabled: true
  inputs:  ["tool_frontend/src/**/*", "tool_frontend/package.json"]
  outputs: ["tool_frontend/dist/**/*"]

steps:
  - name: build
    description: "Build the frontend"
    run: yarn build
