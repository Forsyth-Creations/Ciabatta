# The three checks CI enforces, in the order that fails fastest.

description = "Format, lint and test — everything CI gates on"
owner       = "Henry Forsyth"
requires    = ["cargo"]

[[steps]]
name        = "format"
description = "Verify the tree is rustfmt-clean"
run         = "cargo fmt --check"

[[steps]]
name        = "lint"
description = "Clippy with warnings denied, as CI runs it"
run         = "cargo clippy -- -D warnings"
needs       = ["format"]
timeout     = "20m"

[[steps]]
name        = "unit"
description = "The full test suite"
run         = "cargo test"
needs       = ["lint"]
timeout     = "20m"
